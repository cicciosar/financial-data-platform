name: Ingest Eurostat Financial Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download latest Eurostat financial data
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path
          from datetime import datetime

          BASE_URL = (
              "https://ec.europa.eu/eurostat/api/dissemination/"
              "statistics/1.0/data/nasa_10_f_bs"
          )

          COUNTRIES = ["NL", "DE", "FR", "IT", "ES"]

          current_year = datetime.utcnow().year

          # Try the current year and previous years.
          # Keep the latest two years that actually contain observations.
          candidate_years = [
              current_year,
              current_year - 1,
              current_year - 2,
          ]

          headers = {
              "User-Agent": "financial-data-platform"
          }

          downloaded = []

          for country in COUNTRIES:

              country_dir = Path(
                  f"data/raw/nasa_10_f_bs/{country}"
              )
              country_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              available_years = []

              for year in candidate_years:

                  params = [
                      ("format", "JSON"),
                      ("lang", "EN"),
                      ("freq", "A"),
                      ("geo", country),
                      ("time", str(year)),
                  ]

                  print(
                      f"Checking {country} - {year}..."
                  )

                  response = requests.get(
                      BASE_URL,
                      params=params,
                      headers=headers,
                      timeout=120
                  )

                  response.raise_for_status()

                  data = response.json()

                  values = data.get("value", {})

                  if values:
                      available_years.append(year)

                      output = (
                          country_dir /
                          f"{year}.json"
                      )

                      output.write_text(
                          response.text,
                          encoding="utf-8"
                      )

                      print(
                          f"  Available: {year}"
                      )
                      print(
                          f"  Size: "
                          f"{output.stat().st_size:,} bytes"
                      )

                  else:
                      print(
                          f"  No observations found for {year}"
                      )

              # Keep only the latest two available years
              latest_two = sorted(
                  available_years,
                  reverse=True
              )[:2]

              # Remove older candidate files
              for file in country_dir.glob("*.json"):
                  try:
                      file_year = int(file.stem)

                      if file_year not in latest_two:
                          file.unlink()
                          print(
                              f"  Removed old snapshot: "
                              f"{file.name}"
                          )

                  except ValueError:
                      pass

              downloaded.extend(
                  (country, year)
                  for year in latest_two
              )

              print(
                  f"{country}: latest available years = "
                  f"{latest_two}"
              )

          print()
          print("====================================")
          print("Ingestion completed")
          print("====================================")

          for country, year in downloaded:
              print(f"{country} - {year}")

          print(
              f"Total country-year snapshots: "
              f"{len(downloaded)}"
          )
          PY

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/nasa_10_f_bs/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update latest Eurostat financial data"
            git push
          fi
