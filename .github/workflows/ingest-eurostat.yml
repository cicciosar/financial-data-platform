name: Ingest Eurostat Financial Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download Eurostat datasets
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path
          import time

          BASE_URL = (
              "https://ec.europa.eu/eurostat/api/dissemination/"
              "statistics/1.0/data/nasa_10_f_bs"
          )

          COUNTRIES = ["NL", "DE", "FR", "IT", "ES"]
          YEARS = list(range(2019, 2025))

          headers = {
              "User-Agent": "financial-data-platform"
          }

          total_files = 0

          for country in COUNTRIES:
              country_dir = Path(f"data/raw/nasa_10_f_bs/{country}")
              country_dir.mkdir(parents=True, exist_ok=True)

              for year in YEARS:
                  params = [
                      ("format", "JSON"),
                      ("lang", "EN"),
                      ("freq", "A"),
                      ("geo", country),
                      ("time", str(year)),
                  ]

                  print(f"Downloading {country} - {year}...")

                  response = requests.get(
                      BASE_URL,
                      params=params,
                      headers=headers,
                      timeout=120
                  )

                  response.raise_for_status()

                  data = response.json()

                  output = country_dir / f"{year}.json"
                  output.write_text(
                      response.text,
                      encoding="utf-8"
                  )

                  print(
                      f"  Dataset: {data.get('label')}"
                  )
                  print(
                      f"  HTTP status: {response.status_code}"
                  )
                  print(
                      f"  Size: {output.stat().st_size:,} bytes"
                  )

                  total_files += 1

                  # Small delay between API requests
                  time.sleep(1)

          print()
          print(f"Total files downloaded: {total_files}")
          PY

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/nasa_10_f_bs/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update Eurostat financial data"
            git push
          fi
